<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>luau-obf</title>
  <style>
    body {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
      color: #111;
      background: #fff;
      font-size: 13px;
    }
    h1 { font-size: 18px; margin: 0 0 12px; font-weight: 600; }
    #loading { padding: 6px 0; color: #666; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; display: flex; flex-direction: column; }
    .row label { font-size: 11px; color: #666; margin-bottom: 2px; }
    textarea {
      width: 100%;
      min-height: 420px;
      font-family: inherit;
      font-size: 12px;
      padding: 6px;
      border: 1px solid #999;
      background: #fff;
      resize: vertical;
    }
    textarea[readonly] { background: #f8f8f8; color: #333; }
    .stats { font-size: 11px; color: #666; margin-top: 2px; }
    .examples { margin: 10px 0; font-size: 12px; }
    .examples a { color: #06c; cursor: pointer; margin-right: 8px; }
    .examples a:hover { text-decoration: underline; }
    .controls { margin: 12px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button {
      font-family: inherit;
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
    }
    button:disabled { color: #999; cursor: not-allowed; }
    input[type=text] {
      font-family: inherit;
      font-size: 11px;
      padding: 3px 5px;
      border: 1px solid #999;
      width: 280px;
    }
    .seed { font-size: 11px; color: #666; display: flex; align-items: center; gap: 4px; }
    #status { font-size: 11px; color: #666; margin-left: auto; }
    #status.ok { color: #060; }
    #status.error { color: #c00; }
    #errorPane {
      display: none;
      white-space: pre-wrap;
      border: 1px solid #c00;
      background: #fff5f5;
      color: #c00;
      padding: 6px;
      margin: 8px 0;
      font-size: 12px;
    }
    #errorPane.shown { display: block; }
    footer {
      margin-top: 24px;
      padding-top: 8px;
      border-top: 1px solid #ddd;
      font-size: 11px;
      color: #666;
    }
    footer a { color: #06c; }
  </style>
</head>
<body>
  <h1>luau-obf</h1>
  <div id="loading">loading wasm…</div>

  <div class="examples">
    examples:
    <a data-example="hello">hello</a>
    <a data-example="factorial">factorial</a>
    <a data-example="counter">counter</a>
    <a data-example="point">point</a>
  </div>

  <div id="errorPane"></div>

  <div class="row">
    <div>
      <label for="src">input.luau</label>
      <textarea id="src" spellcheck="false"></textarea>
      <div class="stats" id="inputStats">0 lines · 0 bytes</div>
    </div>
    <div>
      <label for="out">obfuscated.luau</label>
      <textarea id="out" spellcheck="false" readonly></textarea>
      <div class="stats" id="outputStats">—</div>
    </div>
  </div>

  <div class="controls">
    <button id="goBtn" disabled>obfuscate</button>
    <button id="copyBtn">copy</button>
    <button id="downloadBtn">download</button>
    <span class="seed">
      seed (hex, optional):
      <input id="seed" type="text" placeholder="64 hex chars · random if blank" maxlength="64">
    </span>
    <span id="status"></span>
  </div>

  <footer>
    <a href="https://github.com/iamaperson000/luau-obf">github.com/iamaperson000/luau-obf</a>
  </footer>

  <script type="module">
    import init, { obfuscate } from './pkg/luau_obf.js';

    const examples = {
      hello: `print("hello, world")\nprint(1 + 2)\n`,
      factorial: `function factorial(n)\n    if n <= 1 then return 1 end\n    return n * factorial(n - 1)\nend\nprint(factorial(6))\n`,
      counter: `local function make_counter()\n    local n = 0\n    local function inc()\n        n = n + 1\n        return n\n    end\n    return inc\nend\n\nlocal c1 = make_counter()\nlocal c2 = make_counter()\nprint(c1())\nprint(c1())\nprint(c2())\nprint(c1())\n`,
      point: `local point = {x = 1, y = 2}\nfunction point:magnitude()\n    return self.x * self.x + self.y * self.y\nend\nfunction point:scale(k)\n    self.x = self.x * k\n    self.y = self.y * k\nend\nprint(point:magnitude())\npoint:scale(3)\nprint(point:magnitude())\n`,
    };

    const $ = (id) => document.getElementById(id);
    const src = $('src');
    const out = $('out');
    const errorPane = $('errorPane');
    const status = $('status');

    function updateStats(txt, target) {
      const lines = txt ? txt.split('\n').length : 0;
      const bytes = new TextEncoder().encode(txt).length;
      const human = bytes < 1024 ? `${bytes} bytes` : `${(bytes/1024).toFixed(1)} KB`;
      target.textContent = `${lines} lines · ${human}`;
    }

    src.addEventListener('input', () => updateStats(src.value, $('inputStats')));

    function setStatus(msg, kind) {
      status.textContent = msg;
      status.className = kind || '';
    }
    function showError(msg) {
      errorPane.textContent = msg;
      errorPane.classList.add('shown');
    }
    function clearError() {
      errorPane.textContent = '';
      errorPane.classList.remove('shown');
    }

    document.querySelectorAll('.examples a').forEach(a => {
      a.addEventListener('click', () => {
        src.value = examples[a.dataset.example];
        src.dispatchEvent(new Event('input'));
        out.value = '';
        $('outputStats').textContent = '—';
        clearError();
        setStatus('');
      });
    });

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
      return ok;
    }

    $('copyBtn').addEventListener('click', async () => {
      const text = out.value;
      if (!text) return;
      const ok = await copyText(text);
      if (ok) {
        const bytes = new TextEncoder().encode(text).length;
        const human = bytes < 1024 ? `${bytes} bytes` : `${(bytes/1024).toFixed(1)} KB`;
        setStatus(`copied ${human}`, 'ok');
      } else {
        out.focus();
        out.select();
        setStatus('copy failed — Cmd/Ctrl+C to copy selection', 'error');
      }
    });

    $('downloadBtn').addEventListener('click', () => {
      if (!out.value) return;
      const blob = new Blob([out.value], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'obfuscated.luau';
      a.click();
      URL.revokeObjectURL(url);
    });

    $('goBtn').addEventListener('click', () => {
      clearError();
      setStatus('compiling…');
      $('goBtn').disabled = true;
      const seedRaw = $('seed').value.trim();
      setTimeout(() => {
        try {
          const t0 = performance.now();
          const result = obfuscate(src.value, seedRaw || null);
          const dt = performance.now() - t0;
          if (result && result.ok) {
            out.value = result.output;
            updateStats(out.value, $('outputStats'));
            const ratio = out.value.length / Math.max(1, src.value.length);
            setStatus(`ok · ×${ratio.toFixed(1)} · seed ${result.seed_used.slice(0, 8)}… · ${dt.toFixed(0)} ms`, 'ok');
          } else {
            out.value = '';
            $('outputStats').textContent = '—';
            showError((result && result.error) || 'unknown error');
            setStatus('failed', 'error');
          }
        } catch (e) {
          showError(String(e && e.message || e));
          setStatus('wasm error', 'error');
        } finally {
          $('goBtn').disabled = false;
        }
      }, 0);
    });

    (async () => {
      try {
        await init();
        $('loading').remove();
        $('goBtn').disabled = false;
        src.value = examples.hello;
        src.dispatchEvent(new Event('input'));
        setStatus('ready', 'ok');
      } catch (e) {
        $('loading').textContent = 'failed to load wasm: ' + e;
      }
    })();
  </script>
</body>
</html>
